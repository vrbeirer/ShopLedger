<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order-placement flow</title>
  <desc id="desc">Browser UI reaches Express server routes, which call the library modules, configuration, and JSON database. The numbered order-placement flow is highlighted.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="flowArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <style>
      .bg { fill:#f8fafc; }
      .zone { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.5; }
      .node { fill:#ffffff; stroke:#64748b; stroke-width:1.4; }
      .node-title { font: 600 15px Arial, sans-serif; fill:#0f172a; }
      .node-text { font: 12px Arial, sans-serif; fill:#334155; }
      .small { font: 12px Arial, sans-serif; fill:#475569; }
      .zone-title { font: 600 17px Arial, sans-serif; fill:#0f172a; }
      .edge { fill:none; stroke:#64748b; stroke-width:1.5; marker-end:url(#arrow); }
      .edge-label { font: 12px Arial, sans-serif; fill:#475569; }
      .flow { fill:none; stroke:#2563eb; stroke-width:2.5; marker-end:url(#flowArrow); }
      .flow-label { font: 600 12px Arial, sans-serif; fill:#1d4ed8; }
      .focus { fill:#fff7ed; stroke:#ea580c; stroke-width:2; }
      .focus-title { font: 600 15px Arial, sans-serif; fill:#9a3412; }
      .focus-text { font: 12px Arial, sans-serif; fill:#9a3412; }
      .step { fill:#2563eb; }
      .step-text { font: 600 12px Arial, sans-serif; fill:#ffffff; text-anchor:middle; dominant-baseline:central; }
      .legend { font: 12px Arial, sans-serif; fill:#334155; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="800"/>
  <text x="32" y="34" class="zone-title" style="font-size:22px">ShopLedger — Node/Express POS, Khata &amp; GST architecture</text>
  <text x="32" y="55" class="small">Verified source map and the POST /api/orders execution path</text>

  <!-- Browser -->
  <rect class="zone" x="30" y="82" width="215" height="210" rx="10"/>
  <text x="48" y="110" class="zone-title">Browser</text>
  <rect class="node" x="48" y="126" width="178" height="92" rx="7"/>
  <text x="62" y="151" class="node-title">public/</text>
  <text x="62" y="173" class="node-text">index.html</text>
  <text x="62" y="191" class="node-text">js/app.js · css/style.css</text>
  <text x="48" y="249" class="small">POS, order history, Khata,</text>
  <text x="48" y="266" class="small">reports &amp; invoice links</text>

  <!-- Server -->
  <rect class="zone" x="275" y="82" width="240" height="210" rx="10"/>
  <text x="293" y="110" class="zone-title">HTTP server</text>
  <rect class="node" x="293" y="126" width="204" height="92" rx="7"/>
  <text x="308" y="151" class="node-title">server.js</text>
  <text x="308" y="173" class="node-text">Express + bodyParser.json()</text>
  <text x="308" y="191" class="node-text">static public/ · /api mounts</text>
  <text x="293" y="249" class="small">GET /orders/:id/invoice</text>
  <text x="293" y="266" class="small">calls store.read → orders.get → invoice.render</text>

  <!-- Routers -->
  <rect class="zone" x="545" y="82" width="290" height="410" rx="10"/>
  <text x="563" y="110" class="zone-title">routes/ (mounted at /api)</text>
  <rect class="node" x="563" y="128" width="254" height="66" rx="7"/>
  <text x="577" y="151" class="node-title">products.js</text>
  <text x="577" y="173" class="node-text">GET /products · GET /coupons</text>
  <rect class="node" x="563" y="208" width="254" height="86" rx="7"/>
  <text x="577" y="231" class="node-title">orders.js</text>
  <text x="577" y="252" class="node-text">GET /orders · GET /orders/:id</text>
  <text x="577" y="273" class="node-text">POST /orders · POST /orders/:id/cancel</text>
  <rect class="node" x="563" y="308" width="254" height="66" rx="7"/>
  <text x="577" y="331" class="node-title">customers.js</text>
  <text x="577" y="353" class="node-text">GET /customers · POST /:id/settle</text>
  <rect class="node" x="563" y="388" width="254" height="86" rx="7"/>
  <text x="577" y="411" class="node-title">reports.js</text>
  <text x="577" y="432" class="node-text">dashboard · GST reconciliation</text>
  <text x="577" y="453" class="node-text">POST /pricing/preview · admin/export</text>

  <!-- Config and DB -->
  <rect class="zone" x="865" y="82" width="305" height="220" rx="10"/>
  <text x="883" y="110" class="zone-title">Configuration &amp; persistence</text>
  <rect class="node" x="883" y="128" width="269" height="62" rx="7"/>
  <text x="897" y="151" class="node-title">config.js</text>
  <text x="897" y="173" class="node-text">shop · GST HSN slabs · coupons · inventory</text>
  <rect class="node" x="883" y="207" width="269" height="76" rx="7"/>
  <text x="897" y="230" class="node-title">data/db.json</text>
  <text x="897" y="251" class="node-text">products · orders · customers</text>
  <text x="897" y="270" class="node-text">settlements · auditLog · next IDs</text>

  <!-- Libraries -->
  <rect class="zone" x="30" y="520" width="1140" height="218" rx="10"/>
  <text x="48" y="548" class="zone-title">lib/</text>
  <rect class="node" x="48" y="564" width="166" height="74" rx="7"/>
  <text x="60" y="587" class="node-title">store.js</text>
  <text x="60" y="608" class="node-text">read · write · appendAudit</text>
  <text x="60" y="625" class="node-text">JSON database access</text>
  <rect class="node" x="228" y="564" width="166" height="74" rx="7"/>
  <text x="240" y="587" class="node-title">inventory.js</text>
  <text x="240" y="608" class="node-text">find · check · reserve</text>
  <text x="240" y="625" class="node-text">release · summarize</text>
  <rect class="node" x="408" y="564" width="166" height="74" rx="7"/>
  <text x="420" y="587" class="node-title">orders.js</text>
  <text x="420" y="608" class="node-text">add · get · cancel · list</text>
  <text x="420" y="625" class="node-text">order record lifecycle</text>
  <rect class="node" x="588" y="564" width="166" height="74" rx="7"/>
  <text x="600" y="587" class="node-title">ledger.js</text>
  <text x="600" y="608" class="node-text">findCustomer · listCustomers</text>
  <text x="600" y="625" class="node-text">charge · reverse · settlement</text>
  <rect class="node" x="768" y="564" width="166" height="74" rx="7"/>
  <text x="780" y="587" class="node-title">coupons.js</text>
  <text x="780" y="608" class="node-text">normalize · validate</text>
  <text x="780" y="625" class="node-text">calculateDiscount · listActive</text>
  <rect class="node" x="948" y="564" width="204" height="74" rx="7"/>
  <text x="960" y="587" class="node-title">dates.js</text>
  <text x="960" y="608" class="node-text">today · normalizeDateKey</text>
  <text x="960" y="625" class="node-text">getFiscalYear</text>
  <rect class="node" x="48" y="650" width="166" height="70" rx="7"/>
  <text x="60" y="674" class="node-title">pricing.js</text>
  <text x="60" y="695" class="node-text">subtotal · discount</text>
  <text x="60" y="712" class="node-text">computeTotals</text>
  <rect class="focus" x="228" y="650" width="166" height="70" rx="7"/>
  <text x="240" y="674" class="focus-title">tax.js</text>
  <text x="240" y="695" class="focus-text">getRateForItem</text>
  <text x="240" y="712" class="focus-text">getSlabPercent · splitCgstSgst</text>
  <rect class="node" x="408" y="650" width="166" height="70" rx="7"/>
  <text x="420" y="674" class="node-title">reports.js</text>
  <text x="420" y="695" class="node-text">getDashboardSummary</text>
  <text x="420" y="712" class="node-text">getGstReconciliation</text>
  <rect class="focus" x="588" y="650" width="166" height="70" rx="7"/>
  <text x="600" y="674" class="focus-title">invoice.js</text>
  <text x="600" y="695" class="focus-text">computeInvoiceFigures</text>
  <text x="600" y="712" class="focus-text">render</text>

  <!-- General links -->
  <path class="edge" d="M245 172 H292"/>
  <path class="edge" d="M515 172 H562"/>
  <path class="edge" d="M835 160 H882"/>
  <path class="edge" d="M1017 190 V206"/>
  <path class="edge" d="M670 492 V519"/>
  <path class="edge" d="M1100 302 V520 H1138"/>
  <text x="1030" y="390" class="edge-label">read / write</text>
  <path class="edge" d="M1030 190 V550 H393"/>
  <text x="830" y="538" class="edge-label">tax rules &amp; coupons</text>

  <!-- Numbered order flow, deliberately overlaid in blue -->
  <path class="flow" d="M137 218 V330 H690 V294"/>
  <circle class="step" cx="137" cy="316" r="11"/><text class="step-text" x="137" y="316">1</text>
  <text x="153" y="320" class="flow-label">POST /api/orders</text>
  <path class="flow" d="M625 294 V530 H131 V564"/>
  <circle class="step" cx="625" cy="514" r="11"/><text class="step-text" x="625" y="514">2</text>
  <text x="642" y="518" class="flow-label">store.read()</text>
  <path class="flow" d="M214 601 H228"/>
  <circle class="step" cx="220" cy="584" r="11"/><text class="step-text" x="220" y="584">3</text>
  <text x="230" y="648" class="flow-label">inventory.find/check</text>
  <path class="flow" d="M394 601 H408 V685 H214"/>
  <circle class="step" cx="401" cy="670" r="11"/><text class="step-text" x="401" y="670">4</text>
  <text x="250" y="744" class="flow-label">subtotal → coupon validation → totals → GST rate</text>
  <path class="flow" d="M214 685 H407"/>
  <circle class="step" cx="312" cy="667" r="11"/><text class="step-text" x="312" y="667">5</text>
  <text x="50" y="744" class="flow-label">inventory.reserve</text>
  <path class="flow" d="M394 601 H490 V564"/>
  <circle class="step" cx="475" cy="586" r="11"/><text class="step-text" x="475" y="586">6</text>
  <text x="510" y="732" class="flow-label">orders.add</text>
  <path class="flow" d="M574 601 H588"/>
  <circle class="step" cx="580" cy="583" r="11"/><text class="step-text" x="580" y="583">7</text>
  <text x="600" y="744" class="flow-label">if Khata: ledger charge</text>
  <path class="flow" d="M754 601 H850 V601 H214"/>
  <circle class="step" cx="850" cy="583" r="11"/><text class="step-text" x="850" y="583">8</text>
  <text x="790" y="744" class="flow-label">audit + db write</text>

  <!-- Legend -->
  <rect x="865" y="322" width="305" height="154" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="883" y="348" class="node-title">Legend</text>
  <rect x="883" y="362" width="18" height="14" class="node" rx="2"/><text x="911" y="374" class="legend">Verified module / component</text>
  <rect x="883" y="390" width="18" height="14" class="focus" rx="2"/><text x="911" y="402" class="legend">Ticket focus: invoice.js, tax.js</text>
  <line x1="883" y1="426" x2="920" y2="426" class="flow"/><text x="930" y="430" class="legend">Numbered order-placement flow</text>
  <text x="883" y="458" class="small">All labels correspond to files and functions</text>
  <text x="883" y="474" class="small">found in this repository.</text>
</svg>
